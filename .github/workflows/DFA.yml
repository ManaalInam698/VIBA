name: Daily Financial Audit

on:
  schedule:
    # Daily at 00:00 UTC. GitHub scheduled workflows may be delayed.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-audit:
    name: Extract, transform and audit Excel data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run financial ETL and audit
        run: python src/main.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-audit-report-${{ github.run_number }}
          path: reports/*.xlsx
          if-no-files-found: warn
          retention-days: 30
